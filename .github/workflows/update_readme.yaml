name: Update README Status

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update to latest
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          git pull origin ${BRANCH}
          git reset --hard origin/${BRANCH}

      - name: Get Current Run ID
        id: runid
        run: |
          if [[ -f "runid" ]]; then
            echo "id=$(cat runid)" >> $GITHUB_OUTPUT
          else
            echo "Error: No active run found"
            exit 1
          fi

      - name: Update README
        run: |
          pip install tabulate requests pyyaml
          python .github/scripts/update_readme.py "${{ steps.runid.outputs.id }}"

      - name: Commit and push results
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update README status [skip ci]"
          git push || (git pull --rebase && git push)
