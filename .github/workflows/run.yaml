name: Build R Packages

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset the build process'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'runs/*/logs/dispatched-packages.txt'
      - 'runs/*/logs/successful-packages.txt'

concurrency:
  group: build-r-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Update to latest
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          git pull origin ${BRANCH}
          git reset --hard origin/${BRANCH}

      - name: save kubeconfig
        shell: bash
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      
      - name: Install Kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/v1.24.4/bin/linux/amd64/kubectl" && \
          chmod +x ./kubectl && \
          mv ./kubectl /usr/local/bin/kubectl && \
          kubectl version

      - name: Check run state
        id: check_state
        run: |
          git pull origin/main --rebase || true
          if [[ -f "runid" ]]; then
            RUN_ID=$(cat runid)
            # Handle reset logic based on event type
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "reset=${{ inputs.reset }}" >> $GITHUB_OUTPUT
            else
              # For both schedule and push events, check timestamp
              TIMESTAMP=$(echo $RUN_ID | cut -d- -f1-3)
              ONE_WEEK_AGO=$(date -d "7 days ago" +%Y-%m-%d)
              if [[ "${TIMESTAMP}" < "${ONE_WEEK_AGO}" ]]; then
                echo "reset=true" >> $GITHUB_OUTPUT
              else
                echo "reset=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "reset=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for completed cycle
        id: cycle_check
        run: |
          if [[ -f "runid" ]]; then
            RUN_ID=$(cat runid)
            if [[ "${{ steps.check_state.outputs.reset }}" != "true" ]] && [[ -f "runs/${RUN_ID}/PACKAGES" ]]; then
              echo "Cycle already completed (PACKAGES file exists). Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Manage build lifecycle
        if: steps.cycle_check.outputs.skip != 'true'
        env:
          RCLONE_CONF: ${{secrets.RCLONE_CONF}}
        id: build
        run: |
          set -euxo pipefail

          if [[ "${{ steps.check_state.outputs.reset }}" == "true" ]]; then
            RUN_ID=$(TZ=EST date '+%Y-%m-%d-%H-%M-%S')
            echo "${RUN_ID}" > runid
            mkdir -p "runs/${RUN_ID}"
            CONTAINER=$(cat CONTAINER_BASE_IMAGE.bioc)
            cp CONTAINER_BASE_IMAGE.bioc "runs/${RUN_ID}/CONTAINER_BASE_IMAGE.bioc"
            
            # Update runs table in main README
            chmod +x .github/scripts/update_runs_table.sh
            bash ./.github/scripts/update_runs_table.sh
            
            # Generate dependency files in Docker container
            docker run -d --rm --name bioc-gen-${RUN_ID} \
              ${CONTAINER} sleep infinity

            # Copy script into container
            docker cp .github/scripts/deps_json.R bioc-gen-${RUN_ID}:/deps_json.R

            # Run script
            docker exec bioc-gen-${RUN_ID} Rscript /deps_json.R \
              --biocdeps=/tmp/biocdeps.json \
              --uniquedeps=/tmp/uniquedeps.json

            # Copy files from container
            docker cp bioc-gen-${RUN_ID}:/tmp/biocdeps.json "runs/${RUN_ID}/"
            docker cp bioc-gen-${RUN_ID}:/tmp/uniquedeps.json "runs/${RUN_ID}/"
            docker cp bioc-gen-${RUN_ID}:/tmp/bioc_version "runs/${RUN_ID}/"
            
            # Stop container and cleanup
            echo "Stopping and removing container..."
            docker stop bioc-gen-${RUN_ID} || true
            docker rm -f bioc-gen-${RUN_ID} || true
            docker system prune -f --volumes --filter || true

            # Setup Kubernetes resources
            bash ./.github/scripts/setup_k8s.sh "nfs" "500Gi" "${RUN_ID}"
            
            # Initialize counters
            echo "0" > "runs/${RUN_ID}/null_push_counter"
            echo "0" > "runs/${RUN_ID}/reset_attempts_counter"
          else
            RUN_ID=$(cat runid)
            CONTAINER=$(cat "runs/${RUN_ID}/CONTAINER_BASE_IMAGE.bioc")
            
            # Handle completed jobs
            bash ./.github/scripts/handle_k8s_jobs.sh \
              "${RUN_ID}" \
              "runs/${RUN_ID}/logs/successful-packages.txt" \
              "runs/${RUN_ID}/logs/failed-packages.txt"
          fi

          # Ensure log directory exists before any operations
          mkdir -p "runs/${RUN_ID}/logs"
          touch "runs/${RUN_ID}/logs/dispatched-packages.txt"

          # Find and dispatch packages
          python ./.github/scripts/find_ready_pkgs.py \
            "runs/${RUN_ID}/biocdeps.json" \
            "runs/${RUN_ID}/ready_packages.txt" \
            "runs/${RUN_ID}/logs/dispatched-packages.txt" \
            "runs/${RUN_ID}/logs/successful-packages.txt" \
            "runs/${RUN_ID}/remaining-packages.json"
          
          # Dispatch jobs with xargs and delay
          cat "runs/${RUN_ID}/ready_packages.txt" | xargs -i bash -c "bash ./.github/scripts/dispatch_k8s_job.sh {} ${CONTAINER} bioc-pvc-${RUN_ID} ${RUN_ID} && sleep 1"

          # Track if we had any new activity
          git add runs/
          ACTIVITY_CHECK=$(git diff --staged --name-status | grep -q "runs/${RUN_ID}/logs/.*packages.txt" && echo "true" || echo "false")
          echo "had_activity=${ACTIVITY_CHECK}" >> $GITHUB_OUTPUT
          
          # Get counter values
          NULL_PUSH_COUNTER_FILE="runs/${RUN_ID}/null_push_counter"
          NULL_PUSH_COUNT=$(cat "${NULL_PUSH_COUNTER_FILE}" 2>/dev/null || echo "0")
          RESET_ATTEMPTS_FILE="runs/${RUN_ID}/reset_attempts_counter"
          RESET_ATTEMPTS=$(cat "${RESET_ATTEMPTS_FILE}" 2>/dev/null || echo "0")
          
          # Check if we need to reset failed packages
          if [[ "${NULL_PUSH_COUNT}" -ge 5 ]] && [[ "${RESET_ATTEMPTS}" -lt 3 ]]; then
            echo "Null push counter reached ${NULL_PUSH_COUNT}, attempting to reset failed packages..."
            
            # Run the reset_failed script
            if bash ./.github/scripts/reset_failed.sh "${RUN_ID}"; then
              # Increment reset attempts counter
              RESET_ATTEMPTS=$((RESET_ATTEMPTS + 1))
              echo "${RESET_ATTEMPTS}" > "${RESET_ATTEMPTS_FILE}"
              
              # Reset null push counter
              echo "0" > "${NULL_PUSH_COUNTER_FILE}"
              
              echo "Failed packages reset. Reset attempts: ${RESET_ATTEMPTS}/3"
            fi
          # If counter is high enough (10), check if we can finish the cycle
          elif [[ "${NULL_PUSH_COUNT}" -ge 10 ]]; then
            echo "Null push counter reached ${NULL_PUSH_COUNT}, checking if cycle can be completed..."
            
            # Check for running jobs, if none - finish the cycle
            RUNNING_JOBS=$(kubectl get jobs -n "ns-${RUN_ID}" -l app=bioc-builder -o name | wc -l)
            
            if [[ "${RUNNING_JOBS}" == "0" ]]; then
              echo "No running jobs and null push counter reached threshold. Finishing cycle..."
              BIOC_VERSION=$(cat "runs/${RUN_ID}/bioc_version")
              OLD_PACKAGES_URL="https://storage.googleapis.com/bioconductor-packages/${BIOC_VERSION}/container-binaries/bioconductor_docker/src/contrib/PACKAGES"
              bash ./.github/scripts/finish_cycle.sh "${RUN_ID}" "${OLD_PACKAGES_URL}" "${CONTAINER}"
              # Reset counter after finishing
              echo "0" > "${NULL_PUSH_COUNTER_FILE}"
            fi
          fi

          # Optimized backup - only copy changed files instead of entire runs/ directory
          mkdir -p /tmp/restore
          cp runid /tmp/restore/
          
          # Stage all changes to identify modified files
          git add runs/
          
          # Only copy new or modified files to restore directory
          git diff --staged --name-only | grep "^runs/" | xargs -r -I{} bash -c 'mkdir -p "/tmp/restore/$(dirname "{}")" && cp "{}" "/tmp/restore/{}"'
          
          echo "Optimized backup complete - only copied changed files"

      - name: Commit and push results
        if: steps.cycle_check.outputs.skip != 'true'
        id: repo_changes
        run: |
          git pull origin main && git reset --hard origin/main || git reset --hard origin/main
          cp -r /tmp/restore/* ./ || true
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add runs/ runid || true
          
          # Check if there are actual changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            # If no changes, increment the null push counter
            RUN_ID=$(cat runid)
            NULL_PUSH_COUNTER_FILE="runs/${RUN_ID}/null_push_counter"
            NULL_PUSH_COUNT=$(cat "${NULL_PUSH_COUNTER_FILE}" 2>/dev/null || echo "0")
            NEW_COUNT=$((NULL_PUSH_COUNT + 1))
            echo "${NEW_COUNT}" > "${NULL_PUSH_COUNTER_FILE}"
            
            # Commit just the counter change
            git add "${NULL_PUSH_COUNTER_FILE}"
            git commit -m "Increment null push counter to ${NEW_COUNT}"
            git push || (git pull --rebase && git push)
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            # Check for new successful packages
            RUN_ID=$(cat runid)
            NEW_SUCCESS=$(git diff --staged -- "runs/${RUN_ID}/logs/successful-packages.txt" | grep -c "^\+" | grep -v "^\+\+\+" || echo "0")
            
            # Always reset null push counter on meaningful changes
            echo "0" > "runs/${RUN_ID}/null_push_counter"
            git add "runs/${RUN_ID}/null_push_counter"
            
            # Only reset attempts counter if we have new successful packages
            if [ "${NEW_SUCCESS}" -gt 0 ]; then
              echo "New successful packages detected (${NEW_SUCCESS}), resetting attempts counter"
              echo "0" > "runs/${RUN_ID}/reset_attempts_counter"
              git add "runs/${RUN_ID}/reset_attempts_counter"
            fi
            
            # Commit all changes
            git commit -m "Build state update: ${{ github.run_id }}"
            git push || (git pull --rebase && git push)
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi
